main: me.utruna.danse.DanseAvecLaStare
version: 2.3.0
name: ModelDancer
author: Utruna
api-version: 1.21
softdepend: [ModelEngine]
commands:
  danse:
    description: Start or stop a dance
    usage: /danse [style|preview <style>|npc <spawn|move|delete|list|highlight|resize|style>|choreo|playlist|list|stop|reload|debug]

permissions:
  danse.player:
    description: Access to basic commands (list, stop)
    default: true
  danse.skin:
    description: Use another player's skin
    default: false
  danse.playlist.play:
    description: Start a public playlist on yourself
    default: true
  danse.static:
    description: Manage static dancers
    default: false
  danse.choreo:
    description: Manage choreography groups
    default: false
  danse.playlist:
    description: Manage and start playlists (staff)
    default: false
  danse.staff:
    description: Access to the staff menu (NPC, playlist, and choreography management)
    default: false
  danse.use:
    description: Use player commands (styles, stop, list, preview)
    default: true
  danse.admin:
    description: Admin commands (reload, choreo)
    default: op
  danse.debug:
    description: Access to diagnostic commands
    default: false
  danse.style:
    description: "Parent permission for style-specific permissions (e.g. danse.style.twist)"
    default: false
    children:
      danse.style.twist: true
      danse.style.dj: true
  danse.*:
    description: Full access to the plugin
    default: op
    children:
      danse.player: true
      danse.skin: true
      danse.staff: true
      danse.static: true
      danse.choreo: true
      danse.playlist: true
      danse.playlist.play: true
      danse.debug: true
      danse.use: true
      danse.admin: true
      danse.style: true