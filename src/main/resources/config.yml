# Configuration du plugin DanseAvecLaStare
# Cette version sera mise à jour automatiquement lors du déploiement de nouvelles versions
configVersion: "1.4"

useModelEngine: true

# Mode de secours pour les clients avec shaders / packs fragiles.
# true = charge un blueprint alternatif plus simple et applique les textures de façon dynamique.
modelEngine:
  useFallbackMode: false
  fallbackModelId: joueur_fallback
  renderRadius: 128


# Configuration des dances - Chaque style de danse est défini ici
# Ajoute une nouvelle danse sans modifier le code Java, juste la config !
dances:

  dj:
    displayName: "DJ"
    modelId: dj_animation1
    animationName: dance
    movementType: dynamic
    
  floss:
    displayName: "floss"
    modelId: player_floss
    animationName: dance
    movementType: dynamic

  macarena:
    displayName: "macarena"
    modelId: player_macarena
    animationName: dance
    movementType: dynamic

  dj2:
    displayName: "DJ2"
    modelId: dj_animation2
    animationName: dance
    movementType: dynamic

  robot:
    displayName: "robot"
    modelId: player_robot
    animationName: dance
    movementType: dynamic

# Durée par défaut de /danse preview <style> si aucune durée n'est précisée en argument (en ticks, 20 ticks = 1 seconde).
preview:
  defaultDurationTicks: 100

# Paramètres du pool de threads utilisé pour les appels à l'API Mojang (récupération des skins).
skinFetcher:
  # Nombre maximum de threads dédiés aux requêtes Mojang. Augmenter si plusieurs dizaines de skins
  # sont chargés simultanément au démarrage ; garder bas sur des serveurs peu chargés.
  maxThreads: 10
  # Délai maximal d'attente d'une réponse Mojang avant abandon (en secondes).
  # En cas de timeout, le skin est ignoré et la danse est annulée pour ce joueur.
  timeoutSeconds: 5

# Limites et comportements des danses joueur.
dance:
  # Nombre maximal de danses actives en parallèle sur le serveur (joueurs + previews).
  # Chaque danse alloue 1 Dummy, 1 ModeledEntity et 1 ActiveModel dans ModelEngine.
  # Mettre à 0 pour désactiver la limite.
  maxConcurrent: 0

staticDancer:
  # Fréquence du tick global qui vérifie et relance les animations arrêtées (en ticks).
  # 1 = 20 vérifications/sec/danseur (précis mais lourd). 4 = 5/sec (recommandé pour 50+ NPCs).
  # Augmenter si le serveur a beaucoup de danseurs statiques et que le CPU est élevé.
  animTickPeriod: 4
  # Nombre de danseurs chargés par lot au démarrage du serveur.
  loadBatchSize: 10
  # Intervalle en ticks entre chaque lot de chargement.
  # loadBatchSize: 10 + loadTickDelay: 6  → 170 danseurs en ~102 ticks (~5s)
  # loadBatchSize: 10 + loadTickDelay: 12 → 170 danseurs en ~204 ticks (~10s)
  loadTickDelay: 6
  # Active le refresh des entités ModelEngine au join d'un joueur.
  # Si false (défaut), ME4 gère la visibilité nativement — aucun lag au join.
  # Activer uniquement si les NPCs n'apparaissent pas aux joueurs qui se connectent.
  refreshOnJoin: false
  # Nombre de danseurs traités par tick lors du refresh au join (si refreshOnJoin: true).
  # Valeur basse = moins de lag au join, mais le refresh prend plus de ticks.
  refreshBatchSize: 10

worlds:
  allowedWorlds: []
  deniedWorlds: []