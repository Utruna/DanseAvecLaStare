# Configuration for the ModelDancer plugin
# This version is updated automatically when new releases are deployed
configVersion: "1.4"

useModelEngine: true

# Fallback mode for clients with shaders / fragile packs.
# true = loads a simpler fallback blueprint and applies textures dynamically.
modelEngine:
  useFallbackMode: false
  fallbackModelId: joueur_fallback
  renderRadius: 256


# Dance configuration - each dance style is defined here
# Add a new dance without changing Java code, just edit the config.
dances:
  twist:
    displayName: "Twist"
    modelId: danseur
    animationName: dance
    movementType: dynamic

  dj:
    displayName: "DJ"
    modelId: dj_animation1
    animationName: dance
    movementType: dynamic
    
  floss:
    displayName: "floss"
    modelId: player_floss
    animationName: dance
    movementType: dynamic

  macarena:
    displayName: "macarena"
    modelId: player_macarena
    animationName: dance
    movementType: dynamic

  dj2:
    displayName: "DJ2"
    modelId: dj_animation2
    animationName: dance
    movementType: dynamic

  robot:
    displayName: "robot"
    modelId: player_robot
    animationName: dance
    movementType: dynamic

# Default duration for /danse preview <style> when no duration is provided (in ticks, 20 ticks = 1 second).
preview:
  defaultDurationTicks: 100

# Thread pool settings used for Mojang API calls (skin fetching).
skinFetcher:
  # Maximum number of threads dedicated to Mojang requests. Increase if dozens of skins
  # are loaded simultaneously at startup; keep it low on lightly loaded servers.
  maxThreads: 4
  # Maximum wait time for a Mojang response before giving up (in seconds).
  # On timeout, the skin is ignored and the dance is cancelled for that player.
  timeoutSeconds: 5

# Player dance limits and behavior.
dance:
  # Maximum number of active dances in parallel on the server (players + previews).
  # Each dance allocates 1 Dummy, 1 ModeledEntity, and 1 ActiveModel in ModelEngine.
  # Set to 0 to disable the limit.
  maxConcurrent: 0

worlds:
  allowedWorlds: []
  deniedWorlds: []